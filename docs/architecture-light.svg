<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 692" width="980" height="692" role="img" aria-labelledby="t d">
<title id="t">How Culprit works</title>
<desc id="d">The app reads flags through Flags.variant, which serves the control value when killswitch_flag is on, and tags every crash and session with the variant. Crash data reaches Culprit through the Crashlytics BigQuery export or the Sentry API. Every 15 minutes the Culprit job counts users per variant, detects regressions against control with a sequential test, skips repeats, optionally turns on the kill switch, breaks errors down by OS and device, alerts Slack and writes an audit row. On the next flag fetch, users get the control value.</desc>
